name: EntrenarIA audit - real UI flows
on:
  push:
    branches: [main]
    paths:
      - 'tests/diagnostic-ui.cjs'
      - '.github/workflows/audit-ui.yml'
      - 'src/**'
      - 'electron/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install app and browser test packages
        run: |
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
          npm install --no-save puppeteer-core pdf-lib jszip
      - name: Inspect dependency advisories
        run: |
          npm audit --json > /tmp/entrenaria-npm-audit.json || true
          node -e "const j=require('/tmp/entrenaria-npm-audit.json'); console.log('AUDIT_VULNERABILITIES',JSON.stringify({counts:j.metadata?.vulnerabilities,packages:Object.entries(j.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,fix:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})}))}))"
      - name: Build web
        run: npm run build
      - name: Run browser audit
        run: |
          which google-chrome
          CHROME_BIN=/usr/bin/google-chrome node tests/diagnostic-ui.cjs
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Electron and test packages
        run: |
          npm ci
          npm install --no-save puppeteer-core pdf-lib jszip
      - name: Run Electron desktop with npm start
        run: |
          which xvfb-run
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm start -- --remote-debugging-port=9223 > /tmp/entrenaria-electron.log 2>&1 &
          echo $! > /tmp/entrenaria-electron.pid
          sleep 8
          cat /tmp/entrenaria-electron.log
          TARGET=electron node tests/diagnostic-ui.cjs
      - name: Show Electron output if audit fails
        if: failure()
        run: cat /tmp/entrenaria-electron.log || true
