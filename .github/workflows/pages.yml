name: Verify and deploy EntrenarIA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public GitHub Pages URL
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          test -n "$URL"
          for attempt in 1 2 3 4 5 6; do
            HTML=$(curl -fsSL --max-time 15 "$URL" || true)
            if echo "$HTML" | grep -q 'EntrenarIA' && echo "$HTML" | grep -q '/assets/'; then
              echo "Published web page is accessible: $URL"
              exit 0
            fi
            sleep 4
          done
          echo "Published page was not yet accessible"
          exit 1
